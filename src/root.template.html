<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
{{head}}
<noscript><meta http-equiv="refresh" content="0;url=/en/"></noscript>
<script>
/* Where to go, in order: the language saved by the language menu, the browser's language
   list (first entry the site can serve), then English. Query and hash are kept. */
(function(){
  var PATHS = { 'en': '/en/', 'zh-Hant': '/zh-hant/', 'zh-Hans': '/zh-hans/', 'de': '/de/', 'fr': '/fr/', 'es': '/es/', 'pt-BR': '/pt-br/', 'ja': '/ja/', 'vi': '/vi/', 'eo': '/eo/' };
  function mapTag(tag){
    var t = String(tag || '').toLowerCase();
    var parts = t.split(/[-_]/);
    if (parts[0] === 'zh') {
      if (['tw', 'hk', 'mo'].indexOf(parts[1]) >= 0 || t.indexOf('hant') >= 0) return 'zh-Hant';
      return 'zh-Hans';
    }
    if (parts[0] === 'en') return 'en';
    if (parts[0] === 'de') return 'de';
    if (parts[0] === 'fr') return 'fr';
    if (parts[0] === 'es') return 'es';
    if (parts[0] === 'pt') return 'pt-BR';
    if (parts[0] === 'ja') return 'ja';
    if (parts[0] === 'vi') return 'vi';
    if (parts[0] === 'eo') return 'eo';
    return null;
  }
  function detectLang(){
    try { var s = localStorage.getItem('lang'); if (PATHS.hasOwnProperty(s)) return s; } catch (e) {}
    var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < tags.length; i++) { var l = mapTag(tags[i]); if (l) return l; }
    return 'en';
  }
  location.replace(PATHS[detectLang()] + location.search + location.hash);
})();
</script>
<style>
:root{--bg:#E8F5FD;--fg:#152238;--fg-2:#3F526F}
@media (prefers-color-scheme: dark){:root{--bg:#071221;--fg:#EAF2FA;--fg-2:#A9BCD3}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:17px/1.6 'Segoe UI',system-ui,sans-serif}
main{text-align:center;padding:24px}
img{display:block;width:72px;height:72px;margin:0 auto 12px;border-radius:16px}
h1{margin:0;font-size:28px;line-height:1.2}
.amber{color:#F6A609}
ul{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;list-style:none;margin:24px 0 0;padding:0}
a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:2px solid currentColor;border-radius:12px;color:var(--fg);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="" width="72" height="72">
  <h1><span class="amber">7-</span>ZSTar</h1>
  <ul>
    <li><a href="/en/" lang="en" hreflang="en">English</a></li>
    <li><a href="/zh-hant/" lang="zh-Hant" hreflang="zh-Hant">繁體中文</a></li>
    <li><a href="/zh-hans/" lang="zh-Hans" hreflang="zh-Hans">简体中文</a></li>
    <li><a href="/de/" lang="de" hreflang="de">Deutsch</a></li>
    <li><a href="/fr/" lang="fr" hreflang="fr">Français</a></li>
    <li><a href="/es/" lang="es" hreflang="es">Español</a></li>
    <li><a href="/pt-br/" lang="pt-BR" hreflang="pt-BR">Português (Brasil)</a></li>
    <li><a href="/ja/" lang="ja" hreflang="ja">日本語</a></li>
    <li><a href="/vi/" lang="vi" hreflang="vi">Tiếng Việt</a></li>
    <li><a href="/eo/" lang="eo" hreflang="eo">Esperanto</a></li>
  </ul>
</main>
</body>
</html>

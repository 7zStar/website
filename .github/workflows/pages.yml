name: pages

# Publishes the static site to GitHub Pages on every push to main.
# The language pages are generated from src/ just before the upload and are not
# committed. Only the public/ directory is uploaded; src/, tools/ and the
# repository's other files never reach the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; a newer push waits for it instead of cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Actions are pinned to a commit, not a moving tag. Versions below were
    # checked against each action's latest release on 2026-11-06.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard library only; python3 ships with the runner image.
      - name: Build the language pages
        run: python3 tools/build-pages.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

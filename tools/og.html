<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>7-ZSTar share image</title>
<!-- tools/make-og.py fills in the three lines and the language from src/i18n.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@800&amp;display=swap">
<!-- Full Unbounded from Google for every letter the self-hosted subset below does not have (accents, guillemets, Vietnamese, Esperanto) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;display=swap">
<style>
/* The subset only covers ASCII and a few punctuation marks; the range keeps those on the self-hosted file and sends the rest to the Google face above */
@font-face{font-family:'Unbounded';font-weight:500 900;src:url(../public/fonts/unbounded.woff2) format('woff2');unicode-range:U+0020-007E,U+00B7,U+00D7,U+2013,U+2014,U+2018,U+2019,U+201C,U+201D,U+2026,U+2192}
@font-face{font-family:'Noto Sans SC';font-weight:400 900;src:url(../public/fonts/noto-sans-sc.woff2) format('woff2')}
*{box-sizing:border-box}
html,body{margin:0}
body{position:relative;width:1200px;height:630px;overflow:hidden;color:#FFFFFF;font-family:'Unbounded',sans-serif;background:radial-gradient(620px 460px at 930px 320px,#123A5C 0,rgba(18,58,92,0) 70%),linear-gradient(160deg,#0D2038 0,#071425 100%)}
.wordmark{position:absolute;left:72px;top:60px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.amber{color:#F6A609}
.lines{position:absolute;left:72px;top:176px;display:flex;flex-direction:column;align-items:flex-start;gap:30px;font-weight:800;font-size:44px;line-height:1.1;letter-spacing:-.02em}
html:is([lang="de"],[lang="fr"],[lang="es"],[lang="pt-BR"]) .lines{font-size:40px}
html[lang="zh-Hant"] .lines{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;font-size:46px;line-height:1.25;letter-spacing:0}
html[lang="ja"] .lines{font-family:'Noto Sans JP','Yu Gothic','Meiryo',sans-serif;font-size:46px;line-height:1.25;letter-spacing:0}
html[lang="zh-Hans"] .lines{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-size:46px;line-height:1.25;letter-spacing:0}
.u{box-shadow:0 6px 0 #38BDF8}
.hl{padding:6px 16px;margin-left:-16px;border-radius:10px;color:#F6A609;background:#152238}
.icon{position:absolute;right:76px;top:173px;width:284px;height:284px;transform:rotate(-7deg);filter:drop-shadow(0 0 54px rgba(56,189,248,.28))}
</style>
</head>
<body>
<div class="wordmark"><span class="amber">7-</span>ZSTar</div>
<div class="lines">
  <span id="l1"></span>
  <span class="u" id="l2"></span>
  <span class="hl" id="l3"></span>
</div>
<img class="icon" src="../public/icon.svg" alt="">
</body>
</html>
